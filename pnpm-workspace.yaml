packages:
  - "."
onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - protobufjs
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - next
  - "@next/env"
  - "@next/eslint-plugin-next"
  - "@next/swc-darwin-arm64"
  - "@next/swc-darwin-x64"
  - "@next/swc-linux-arm64-gnu"
  - "@next/swc-linux-arm64-musl"
  - "@next/swc-linux-x64-gnu"
  - "@next/swc-linux-x64-musl"
  - "@next/swc-win32-arm64-msvc"
  - "@next/swc-win32-x64-msvc"
  - eslint-config-next
allowBuilds:
  "@google/genai": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
